# Reditoe — one nginx, three names.
#
#   reditoe.com / www.reditoe.com   the public site, static files
#   admin.reditoe.com               the console, a Next.js process on :3000
#   api.reditoe.com                 the API, a Node process on :5000
#
# Subdomains rather than paths: the console is a Next app that owns its own
# routing from the root, and hosting it under /admin would mean rebuilding it
# with a basePath and re-pointing every link inside it. Three names cost
# nothing and keep each piece unaware of the others.
#
# Certificates are added by certbot, which rewrites the listen lines below.
# Run ec2-setup.sh rather than editing them by hand.

# ── The public site ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name reditoe.com www.reditoe.com;

    root /var/www/reditoe;
    index index.html;

    # Long cache on assets that are rebuilt under a new name when they change,
    # none on the HTML that points at them - otherwise a visitor keeps an old
    # page for a week after a deploy.
    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(html|css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}

# ── The admin console ────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.reditoe.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── The API ──────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.reditoe.com;

    # Menu photographs and KYC documents go through here. The default of 1MB
    # rejects an ordinary phone camera upload.
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Riders hold a socket open for the whole of a delivery.
        proxy_read_timeout 300s;
    }
}


# ── The customer app, on the web ─────────────────────────────────────────
#
# Served from the client's own domain rather than a tunnel on a laptop. The
# API only accepts browser requests from origins it has been told about, and
# a tunnel address is not one of them - which is why the web app reported
# "can't reach the server" while the API was perfectly healthy.
server {
    listen 80;
    server_name app.reditoe.com;

    root /var/www/reditoe-app;
    index index.html;

    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(html|json)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Expo Router writes a file per route; a deep link has to fall back to
    # the route's own page rather than 404.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
